[package]
name = "chorus-finder-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "chorus-finder"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
lofty = "0.25.5"
pinyin = "0.11.0"
regex = "1.13.1"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["mp3", "wav", "flac", "ogg", "aac"] }
whisper-rs = "0.16.0"
